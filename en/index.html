<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tools Hub - Discover the Best AI Tools & Services</title>
  <meta name="description" content="Discover, compare, and find the best AI tools for your needs. Curated directory of artificial intelligence tools and services.">
  <meta name="google-site-verification" content="F7QqxnlQHXrsgKccryTS_WtjsNAJjPO_hWrfbrlB1VA" />
  <meta name="msvalidate.01" content="3FD3D0FF2E8B01EC85CE5958A5E90B8D" />
  <link rel="canonical" href="https://aitools.bmaster.cn/en/">
  <link rel="alternate" hreflang="zh" href="https://aitools.bmaster.cn/">
  <link rel="alternate" hreflang="en" href="https://aitools.bmaster.cn/en/">
  <link rel="stylesheet" href="../style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2831974253933443" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="header-inner">
      <div class="header-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
        <a href="../" class="logo">
          <span class="logo-icon">🤖</span>
          <span class="logo-text" data-i18n="site_name">AI Tools Hub</span>
        </a>
      </div>
      <div class="header-center">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="search_placeholder" placeholder="Search AI tools...">
          <button class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
        </div>
      </div>
      <div class="header-right">
        <div class="sort-wrapper">
          <select id="sortSelect" class="sort-select">
            <option value="popular" data-i18n="sort_popular">Popular</option>
            <option value="newest" data-i18n="sort_newest">Newest</option>
            <option value="az" data-i18n="sort_az">A → Z</option>
          </select>
        </div>
        <button class="lang-toggle" id="langToggle" aria-label="Toggle language">
          <span class="lang-label" id="langLabel">中文</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile sidebar overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main Layout -->
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <h3 class="sidebar-title" data-i18n="categories">Categories</h3>
        <ul class="category-list" id="categoryList">
          <!-- Populated by JS -->
        </ul>
      </div>
      <div class="sidebar-section">
        <h3 class="sidebar-title" data-i18n="pricing_filter">Pricing</h3>
        <ul class="pricing-list" id="pricingList">
          <li class="pricing-item active" data-pricing="all">
            <span data-i18n="all">All</span>
            <span class="count" id="countAll">0</span>
          </li>
          <li class="pricing-item" data-pricing="free">
            <span class="pricing-badge free"></span>
            <span data-i18n="free">Free</span>
            <span class="count" id="countFree">0</span>
          </li>
          <li class="pricing-item" data-pricing="freemium">
            <span class="pricing-badge freemium"></span>
            <span data-i18n="freemium">Freemium</span>
            <span class="count" id="countFreemium">0</span>
          </li>
          <li class="pricing-item" data-pricing="paid">
            <span class="pricing-badge paid"></span>
            <span data-i18n="paid">Paid</span>
            <span class="count" id="countPaid">0</span>
          </li>
        </ul>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <!-- Category pills (mobile + desktop) -->
      <div class="category-pills-wrapper">
        <div class="category-pills" id="categoryPills">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Results info -->
      <div class="results-info">
        <span class="results-count" id="resultsCount"></span>
      </div>

      <!-- Tools Grid -->
      <div class="tools-grid" id="toolsGrid">
        <!-- Populated by JS -->
      </div>

      <!-- Empty state -->
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">🔍</div>
        <h3 data-i18n="no_results">No tools found</h3>
        <p data-i18n="no_results_desc">Try adjusting your search or filters</p>
      </div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="detailModal">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-header">
        <div class="modal-icon" id="modalIcon"></div>
        <div class="modal-title-area">
          <h2 class="modal-title" id="modalTitle"></h2>
          <div class="modal-tags">
            <span class="modal-category" id="modalCategory"></span>
            <span class="modal-pricing" id="modalPricing"></span>
          </div>
        </div>
      </div>
      <div class="modal-body">
        <p class="modal-description" id="modalDescription"></p>
        <div class="modal-features" id="modalFeatures">
          <h4 data-i18n="features">Key Features</h4>
          <ul id="modalFeatureList"></ul>
        </div>
      </div>
      <div class="modal-footer">
        <a class="modal-visit-btn" id="modalVisitBtn" href="#" target="_blank" rel="noopener noreferrer">
          <span data-i18n="visit_site">Visit Website</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p>&copy; 2026 AI Tools Hub. <span data-i18n="footer_rights">All rights reserved.</span></p>
      <a href="privacy.html" class="footer-link" data-i18n="privacy_policy">Privacy Policy</a>
    </div>
  </footer>

  <script>localStorage.setItem('ai_tools_lang','en');</script>
  <script src="../app.js"></script>
</body>
</html>
